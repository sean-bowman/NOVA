[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'nova-nozzle'
version = '0.1.0'
description = 'Rocket nozzle contour, regenerative cooling and plume design'
readme = 'README.md'
requires-python = '>=3.10'
authors = [{ name = 'Sean Bowman', email = 'seanbowman9@gmail.com' }]
keywords = ['rocket', 'nozzle', 'propulsion', 'method of characteristics', 'regenerative cooling']

# Mirrors dependencies.txt. ctREFPROP is deliberately absent: it needs a licensed
# REFPROP installation, and CoolProp covers the same accessor when it is missing.
dependencies = [
    'numpy>=2.2',
    'scipy>=1.15',
    'pandas>=2.3',
    'sympy>=1.14',
    'rocketcea>=1.2.3',
    'CoolProp>=8.0',
    'matplotlib>=3.10',
    'plotly>=5.0',
    'pint>=0.24',
    'joblib>=1.5',
    'tqdm>=4.65',
]

[project.optional-dependencies]
# The front end (novaGui): its server and the desktop window. The built React app ships in
# novaGui/frontend/dist; Node is needed only to change it.
web = ['fastapi>=0.110', 'uvicorn>=0.29', 'pywebview>=5.0']
# REFPROP-backed fluid properties, which need a licensed REFPROP installation.
refprop = ['ctREFPROP>=0.10.5']
# For regenerating the README's images; nothing at runtime reads these. Kaleido exports plotly
# figures as static images and needs a separate Chrome install (`plotly_get_chrome`). Playwright
# drives the GUI for its screenshots and needs its own Chromium (`python -m playwright install
# chromium`).
screenshots = ['kaleido>=0.2', 'playwright>=1.40']

# `nova-gui` opens the GUI in its window with no console. The install has to be editable
# (`pip install -e .[web]`): the GUI reads the checkout's docs/ and src/NOVA/assets/ and exports
# to its runs/ folder.
[project.gui-scripts]
nova-gui = 'novaGui.__main__:main'

[tool.setuptools]
# NOVA lives under src/; the GUI package sits at the repository root
package-dir = { '' = 'src', 'novaGui' = 'novaGui' }

[tool.setuptools.packages.find]
where = ['src', '.']
include = ['NOVA*', 'novaGui*']

[tool.setuptools.package-data]
NOVA = ['assets/*.json', 'assets/*.csv', 'assets/*.npz', 'assets/examples/*.json']
# The window icon, the plume marks and the built front end
novaGui = ['assets/*.png', 'assets/*.ico', 'assets/icon/*.png', 'frontend/dist/*', 'frontend/dist/assets/*']

[tool.pytest.ini_options]
testpaths = ['tests']
# NOVA uses camelCase file and function names, so the default test_*.py
# discovery pattern would match nothing.
python_files = ['test*.py']
python_classes = ['Test*']
python_functions = ['test*']
