# The standalone GUI's release. On a version tag (v<version>, matching pyproject.toml), build NOVA.exe
# on Windows, run the shipped nozzle through it (packaging/smokeTest.py) and attach the zip to a
# GitHub Release. On a pull request that touches the build, or by hand, build and test only, and keep
# the zip as a workflow artifact for two weeks.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The version the development environment runs, so the release is what was tested
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install NOVA and the build tools
        run: python -m pip install ".[web,refprop]" -r packaging/requirements.txt -c packaging/constraints.txt

      - name: Build, smoke-test and zip
        run: python packaging/buildRelease.py ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: NOVA-win64
          path: dist/NOVA-*-win64.zip
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist/NOVA-*-win64.zip).FullName
          gh release create "${{ github.ref_name }}" $zip --title "NOVA ${{ github.ref_name }}" --notes-file packaging/releaseNotes.md --generate-notes
